[project]
name = "organization-baseline"
version = "0.1.0"
description = "Development standards and project starter template"
requires-python = ">=3.13,<3.14"
dependencies = []

[dependency-groups]
dev = [
    "pip-audit>=2.9,<3",
    "pre-commit>=4,<5",
    "pyright>=1.1.400,<2",
    "pytest>=8,<10",
    "ruff>=0.11,<1",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["ignition"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S603", "S607"]
"scripts/check_pr_docs.py" = ["S603", "S607"]

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "strict"
include = ["src", "scripts", "tests"]
exclude = ["ignition", ".venv"]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
addopts = "-ra --strict-markers -o cache_dir=/home/developer/.cache/pytest"