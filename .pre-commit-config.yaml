repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff lint
        entry: uv run --locked ruff check
        language: system
        types: [python]
        exclude: ^ignition/
      - id: ruff-format
        name: Ruff formatting
        entry: uv run --locked ruff format --check
        language: system
        types: [python]
        exclude: ^ignition/
      - id: pyright
        name: Pyright strict types
        entry: uv run --locked pyright
        language: system
        pass_filenames: false
        types: [python]
        exclude: ^ignition/